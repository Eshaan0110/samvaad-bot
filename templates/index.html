<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>संस्कृत • Multilingual Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #f4efe6;
      --card: #ffffff;
      --ink: #2b1f14;
      --muted: #7a6a58;
      --accent: #b4531a;      /* saffron-maroon */
      --accent-soft: #f6e4d4;
      --bot: #f1ead9;
      --user: #b4531a;
      --user-ink: #ffffff;
      --border: #e3d9c6;
      --online: #2e8b57;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: 'Inter', 'Noto Sans Devanagari', system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #ffe9d1 0%, transparent 60%),
        radial-gradient(900px 500px at 110% 10%, #f3dcc0 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(60, 30, 10, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
    }

    header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #fff 0%, #faf5eb 100%);
    }

    .title {
      font-family: 'Noto Sans Devanagari', 'Inter', serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title .dot { color: var(--accent); }

    .subtitle {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .online {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--online);
      background: #e7f4ec;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .online::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.18);
    }

    .lang-row {
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      background: #fdfaf2;
    }
    .lang-row label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    select {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink);
      outline: none;
    }
    select:focus { border-color: var(--accent); }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fffcf5;
    }

    .msg {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.45;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-ink);
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      color: var(--ink);
      border-bottom-left-radius: 4px;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: #fff;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-family: inherit;
      font-size: 14.5px;
      color: var(--ink);
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }

    button {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14.5px;
      transition: filter 0.15s ease;
    }
    button:hover { filter: brightness(1.07); }
    button:active { filter: brightness(0.95); }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 11px;
      color: var(--muted);
      background: #fdfaf2;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <div class="title">
        <span>संस्कृत</span>
        <span class="dot">•</span>
        <span>Multilingual Chatbot</span>
      </div>
      <div class="subtitle">English • संस्कृत | Computational Assistant</div>
      <div class="online">ONLINE</div>
    </header>

    <div class="lang-row">
      <label for="language">Language</label>
      <select id="language">
        <option value="english">English</option>
        <option value="sanskrit" selected>Sanskrit (संस्कृत)</option>
      </select>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot">
        नमस्ते! अहं भवतः साहाय्यं कर्तुं शक्नोमि। Try: <em>hello</em>, <em>who are you</em>, or <em>calculate 12*4</em>.
      </div>
    </div>

    <div class="composer">
      <input id="input" type="text" placeholder="Type your message…" autocomplete="off" />
      <button id="send">Send</button>
    </div>

    <footer>Flask • Docker • Jenkins CI — 23MIS1149</footer>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const language = document.getElementById('language');

    function addMsg(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;
      addMsg(msg, 'user');
      input.value = '';
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg, language: language.value })
        });
        const data = await res.json();
        addMsg(data.response, 'bot');
      } catch (e) {
        addMsg('⚠ Network error. Check the server.', 'bot');
      }
    }

    send.addEventListener('click', sendMessage);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    input.focus();
  </script>
</body>
</html>
